# Open Speech ASR - Legacy SenseVoice + Gemma Backend Configuration

# Server Configuration
server:
  host: "127.0.0.1"
  port: 8001
  workers: 1
  reload: false

# Model Configuration
models:
  inference:
    name: "gemma-e4b-q4"
    path: "./models/gemma-e4b-q4.gguf"
    quantization: "q4"
    contextWindow: 128000
    maxTokens: 2048
  asr:
    name: "sensevoice-small"
    path: "./models/sensevoice-small.onnx"
    language: "auto"

# Inference Configuration
inference:
  batchSize: 1
  temperature: 0.7
  topP: 0.9
  topK: 40
  repeatPenalty: 1.1
  maxNewTokens: 512

# Cache Configuration
cache:
  enabled: true
  ttlSeconds: 86400  # 24 hours
  maxSize: 1000

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/inference.log"
  maxBytes: 10485760  # 10MB
  backupCount: 5

# Performance Configuration
performance:
  enableGPU: true
  enableMetalAcceleration: true
  preloadModel: true
  modelUnloadTimeout: 300  # seconds

# ASR Configuration
asr:
  engine: "sensevoice"  # "sensevoice" or "whisper"
  language: "auto"
  vadEnabled: true
  vadThreshold: 0.5
  audioChunkSize: 16000  # 1 second at 16kHz
  audioSampleRate: 16000

# Text Correction Configuration
correction:
  enabled: true
  model: "gemma-e4b-q4"
  removeFillers: true
  fixPunctuation: true
  fixCapitalization: true
  vocabularyPriority: true
  contextAwareness: true

# API Configuration
api:
  enableDocs: true
  enableRedoc: true
  corsEnabled: true
  corsOrigins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "https://localhost:3000"

# Monitoring Configuration
monitoring:
  metricsEnabled: true
  healthCheckInterval: 30  # seconds
  logMetricsInterval: 60  # seconds
